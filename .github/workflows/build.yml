name: Compile JurkOS

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile JurkOS
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build toolchain & dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gcc-multilib \
            binutils \
            dosfstools \
            mtools \
            parted \
            zip \
            gzip

      - name: Compile Userland Applications (main, JurkStore, wifi, BearSSL wget, .JEX)
        run: |
          REPO_DIR="$GITHUB_WORKSPACE"
          if [ -d "$GITHUB_WORKSPACE/The-JurkOS-Project" ]; then
            REPO_DIR="$GITHUB_WORKSPACE/The-JurkOS-Project"
          fi
          cd "$REPO_DIR"

          echo "=========================================================="
          echo " Compiling BearSSL (Bare-Metal TLS Engine)..."
          echo "=========================================================="
          make -C source/bearssl -j4
          mkdir -p lib
          cp -f source/bearssl/build/libbearssl.a lib/libbearssl.a

          echo "=========================================================="
          echo " Compiling Bare-Metal wget (powered by BearSSL)..."
          echo "=========================================================="
          gcc -static -O2 NoneCompiled/wget.c lib/libbearssl.a -Isource -o iso/bin/wget
          chmod +x iso/bin/wget

          echo "=========================================================="
          echo " Compiling Userland Binaries (Static ELF & .JEX)..."
          echo "=========================================================="
          gcc -static -Wall -Wno-unused-result NoneCompiled/main.c -o iso/sbin/main
          gcc -static -Wall -Wno-unused-result NoneCompiled/jurkstore.c -o iso/bin/JurkStore
          cp -f iso/bin/JurkStore iso/sbin/jurkstore || true
          gcc -static -Wall -Wno-unused-result NoneCompiled/wifi.c -o iso/bin/wifi
          cp -f iso/bin/wifi iso/sbin/wifi || true
          chmod +x iso/bin/* iso/sbin/*
          ln -sf JurkStore iso/bin/jurkstore || true
          cp -f iso/bin/JurkStore iso/bin/jurkstore.jex || true

      - name: Generate Standard FAT32 Disk Image & Install Limine
        run: |
          REPO_DIR="$GITHUB_WORKSPACE"
          if [ -d "$GITHUB_WORKSPACE/The-JurkOS-Project" ]; then
            REPO_DIR="$GITHUB_WORKSPACE/The-JurkOS-Project"
          fi
          cd "$REPO_DIR"

          echo "=========================================================="
          echo " Synchronizing Limine Boot Configuration..."
          echo "=========================================================="
          mkdir -p iso/boot/limine
          rm -rf iso/EFI
          cp -fv iso/boot/limine/limine.cfg iso/boot/limine/limine.conf || true
          cp -fv iso/boot/limine/limine.cfg iso/boot/limine.cfg || true
          cp -fv iso/boot/limine/limine.cfg iso/boot/limine.conf || true

          if ! command -v limine &>/dev/null; then
            echo "[*] Compiling Limine BIOS deployer tool..."
            rm -rf /tmp/limine
            git clone https://github.com/limine-bootloader/limine.git --branch=v8.x-binary --depth=1 /tmp/limine
            make -C /tmp/limine limine || gcc -O2 /tmp/limine/limine.c -o /tmp/limine/limine
            sudo cp -f /tmp/limine/limine /usr/local/bin/limine
            sudo chmod +x /usr/local/bin/limine
          fi

          echo "=========================================================="
          echo " Generating Standard FAT32 Disk Image (128MB)..."
          echo "=========================================================="
          rm -f jurkos.img
          truncate -s 128M jurkos.img
          parted -s jurkos.img mklabel msdos
          parted -s jurkos.img mkpart primary fat32 1MiB 100%
          parted -s jurkos.img set 1 boot on
          printf "\x78\x56\x34\x12" | dd of=jurkos.img bs=1 seek=440 conv=notrunc status=none
          mformat -i jurkos.img@@1M -F -v "JURKOS"
          mcopy -o -s -i jurkos.img@@1M iso/* ::/
          mdir -i jurkos.img@@1M ::/ | head -n 15

          echo "=========================================================="
          echo " Installing 512-byte BIOS MBR Bootloader (Limine Stage 1 & 2)..."
          echo "=========================================================="
          limine bios-install jurkos.img

          echo "[*] Verifying 512-byte MBR boot sector signature (0x55 0xAA)..."
          BOOT_MAGIC=$(od -j 510 -N 2 -t x1 jurkos.img | head -n 1 | awk '{print $2 $3}')
          echo "Sector 0 Magic: $BOOT_MAGIC"
          if [ "$BOOT_MAGIC" != "55aa" ] && [ "$BOOT_MAGIC" != "aa55" ]; then
            echo "::error::MBR 0x55AA boot signature missing from sector 0!"
            exit 1
          fi

          if [ -f "jurkos.img" ] && [ "$PWD" != "$GITHUB_WORKSPACE" ]; then
            cp -f jurkos.img "$GITHUB_WORKSPACE/jurkos.img"
          fi

      - name: Verify disk image
        run: |
          if [ ! -f jurkos.img ]; then
            echo "::error::jurkos.img was not generated!"
            exit 1
          fi
          IMAGE_SIZE=$(stat -c%s jurkos.img)
          echo "Successfully built jurkos.img ($((IMAGE_SIZE / 1024 / 1024)) MB)"
          ls -lh jurkos.img

      - name: Compress image for release and download
        run: |
          echo "Compressing jurkos.img into ZIP..."
          zip -9 jurkos.zip jurkos.img
          echo "Compressing jurkos.img into GZ..."
          gzip -k -9 jurkos.img
          ls -lh jurkos.img jurkos.zip jurkos.img.gz

      - name: Upload Disk Image Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JurkOS-Disk-Image
          path: |
            jurkos.zip
            jurkos.img.gz
            jurkos.img
          retention-days: 7

      - name: Output download instructions
        run: |
          echo "======================================================================"
          echo " 🎉 BUILD SUCCESSFUL - Compile JurkOS"
          echo "======================================================================"
          echo " DOWNLOAD YOUR FILE FROM GITHUB ACTIONS:"
          echo " 1. Go to the Actions Run page:"
          echo "    https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo " 2. Scroll to the bottom of the page under 'Artifacts'."
          echo " 3. Click 'JurkOS-Disk-Image' to download your bootable image (jurkos.zip)!"
          echo "======================================================================"

      - name: Create GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            jurkos.zip
            jurkos.img.gz
            jurkos.img
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
